# Cami verisi için yedek kaynakları dener (yalnızca teşhis; uygulama derlemesini tetiklemez)
name: Overpass testi
on:
  push:
    paths: ['.github/workflows/overpass-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14; wv) AppleWebKit/537.36 Chrome/129.0 Mobile Safari/537.36"
          t(){ echo "=== $1"; curl -s -m 25 -A "$UA" -H 'Origin: https://localhost' -D h.txt -o o.json -w "%{http_code} %{time_total}s %{size_download}B\n" "$2"; grep -i '^access-control-allow-origin' h.txt; python3 - <<'P'
          import json
          try:
            j=json.load(open('o.json'))
            f=j.get('features') if isinstance(j,dict) else j
            print('adet',len(f))
            for x in f[:12]:
              p=x.get('properties',x); print('  ',p.get('name') or p.get('display_name','')[:60], '|', p.get('osm_key',p.get('category')), p.get('osm_value',p.get('type')))
          except Exception as e: print('HATA',e, open('o.json').read()[:200])
          P
          }
          for yer in "41.0082,28.9784" "52.52,13.405" "39.93,32.86"; do
            la=${yer%,*}; lo=${yer#*,}
            t "photon reverse $yer" "https://photon.komoot.io/reverse?lat=$la&lon=$lo&radius=3&limit=50&osm_tag=amenity:place_of_worship"
            t "photon api $yer" "https://photon.komoot.io/api/?q=mosque&lat=$la&lon=$lo&limit=30&osm_tag=amenity:place_of_worship&location_bias_scale=0.1&zoom=14"
            b=$(python3 -c "la,lo=$la,$lo;d=0.03;print(f'{lo-d},{la+d},{lo+d},{la-d}')")
            t "nominatim mosque $yer" "https://nominatim.openstreetmap.org/search?format=jsonv2&q=mosque&viewbox=$b&bounded=1&limit=40"
            t "nominatim cami $yer" "https://nominatim.openstreetmap.org/search?format=jsonv2&q=cami&viewbox=$b&bounded=1&limit=40"
            sleep 2
          done
