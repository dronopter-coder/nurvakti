name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Test ID'si. Gerçek AdMob Uygulama ID'ni GitHub > Settings > Secrets > ADMOB_APP_ID olarak ekle.
  ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Manifest yamalari (AdMob ID + konum izni)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/></application>#" $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/></manifest>#' $M
      - run: npx cap sync android
      - name: APK derle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NurVakti-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
