name: APK ve AAB derle
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor 8 paketleri
        run: |
          npm install @capacitor/core@8 @capacitor/android@8 @capacitor/geolocation@8 @capacitor/haptics@8 @capacitor/local-notifications@8 @capacitor/app@8 @capacitor/share@8 @capacitor-community/admob@8
          npm install -D @capacitor/cli@8
      - run: npx cap add android
      - name: Manifest, ses, ikon ve sürüm
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3204109869365538~9938336202"/></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.camera" android:required="false"/></manifest>#' $M
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          R=android/app/src/main/res
          mkdir -p $R/raw && cp www/vakit.mp3 $R/raw/vakit.mp3
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          R='android/app/src/main/res'
          fg=Image.open('www/icon-fg.png').convert('RGBA'); full=Image.open('www/icon-daire.png').convert('RGBA')  # yedek (eski tip) simge: kenara kadar dolu daire; daireyi tanıyan ana ekranlar beyaz çerçeve eklemeden tam boy gösterir
          for d,a,b in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              p=f'{R}/mipmap-{d}/'
              os.makedirs(p,exist_ok=True)
              full.resize((a,a),Image.LANCZOS).save(p+'ic_launcher.png')
              full.resize((a,a),Image.LANCZOS).save(p+'ic_launcher_round.png')
              fg.resize((b,b),Image.LANCZOS).save(p+'ic_launcher_foreground.png')
          os.makedirs(R+'/mipmap-anydpi-v26',exist_ok=True); os.makedirs(R+'/values',exist_ok=True)
          x='<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/nur_bg"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'
          open(R+'/mipmap-anydpi-v26/ic_launcher.xml','w').write(x); open(R+'/mipmap-anydpi-v26/ic_launcher_round.xml','w').write(x)
          open(R+'/values/nur_colors.xml','w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="nur_bg">#BA4F10</color></resources>')
          PY
          rm -f www/icon-fg.png www/icon-full.png www/icon-daire.png
      - name: Yerli kodlar (kıble pusulası, bildirim ayarı, ana ekran widget'ı)
        run: |
          J=android/app/src/main/java/com/nurvakti/namazvekuran
          test -f $J/MainActivity.java || { echo "MainActivity bulunamadi"; find android/app/src/main/java; exit 1; }
          cp android-ek/*.java $J/
          cp -r android-ek/res/. android/app/src/main/res/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<receiver android:name=".VakitWidget" android:exported="false" android:label="Secdem – Sıradaki vakit"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/><action android:name="com.nurvakti.namazvekuran.VIDJET_TAZELE"/><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/><action android:name="android.intent.action.TIME_SET"/><action android:name="android.intent.action.TIMEZONE_CHANGED"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/vakit_widget_info"/></receiver></application>#' $M
          sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' $M
          grep -q '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"' $M || sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/></manifest>#' $M
          grep -c VakitWidget $M
          sed -i -E 's/versionName "[^"]*"/versionName "2.1"/' android/app/build.gradle
          grep -n "versionName" android/app/build.gradle
          grep -q "app-update" android/app/build.gradle || sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.google.android.play:app-update:2.1.0" \/\/ uygulama içi güncelleme/' android/app/build.gradle
          grep -n "app-update" android/app/build.gradle
      - run: npx cap sync android
      - name: Sabit debug imzası (güncellemenin eskisinin üzerine kurulabilmesi için)
        run: |
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
          cp keystore/debug.keystore android/app/debug.keystore
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          blok = "android {\n    signingConfigs {\n        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
          assert re.search(r'^android \{\s*$', s, re.M), 'android blogu bulunamadi'
          s=re.sub(r'^android \{\s*\n', blok, s, count=1, flags=re.M)
          # yayın sürümünde R8 kod küçültme ve karartma (Play: DEX kodu optimizasyonu)
          assert 'minifyEnabled false' in s, 'minifyEnabled bulunamadi'
          s=s.replace('minifyEnabled false','minifyEnabled true',1).replace("getDefaultProguardFile('proguard-android.txt')","getDefaultProguardFile('proguard-android-optimize.txt')")
          open(p,'w').write(s)
          open('android/app/proguard-rules.pro','a').write('\n'+open('android-ek/proguard-ekle.pro').read())
          PY
          grep -n "versionCode\|storeFile\|minifyEnabled\|proguardFiles" android/app/build.gradle
      - name: Gradle dağıtımı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dagitim-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle'ı indir (sunucu geçici hata verirse birkaç kez dener)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6; do ./gradlew --version && exit 0; echo "Gradle indirilemedi, ${i}. deneme; 30 sn sonra yeniden"; sleep 30; done
          exit 1
      - name: Debug APK ve release AAB derle
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease
      - name: APK imzasını doğrula (sabit anahtarla imzalanmış olmalı)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee cert.txt
          BEKLENEN=$(keytool -list -v -keystore keystore/debug.keystore -storepass android | grep 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "Beklenen SHA-256: $BEKLENEN"
          grep -qi "SHA-256 digest: $BEKLENEN" cert.txt || { echo "IMZA UYUSMUYOR"; exit 1; }
          echo "Imza dogru."
      - name: Simge kontrolü (APK içindeki uygulama simgesi kaynakları)
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l $APK | grep -i "mipmap\|launcher" || true
          $AAPT2 dump badging $APK | grep -i "icon" || true
          $AAPT2 dump resources $APK | grep -B1 -A8 "mipmap/ic_launcher" || true
          for f in $(unzip -Z1 $APK | grep "anydpi"); do echo "== $f"; $AAPT2 dump xmltree --file $f $APK || true; done
      - name: Yayın APK'sını deneme için imzala (sabit debug anahtarıyla)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          R=android/app/build/outputs/apk/release
          $BT/zipalign -p -f 4 $R/app-release-unsigned.apk $R/hizali.apk
          $BT/apksigner sign --ks keystore/debug.keystore --ks-pass pass:android --out $R/app-release-imzali.apk $R/hizali.apk
          ls -la $R
      - name: KVM (emülatör için)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Yayın sürümü açılış testi (emülatör; yalnızca elle başlatılan derlemede)
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/betik/acilis-testi.sh
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: acilis-testi
          path: |
            acilis-*.png
            logcat.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NurVakti-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: AAB imzala (KEYSTORE_BASE64 sırrı tanımlıysa)
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          jarsigner -keystore upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | head -3
      - uses: actions/upload-artifact@v4
        if: ${{ env.KS_B64 != '' }}
        with:
          name: NurVakti-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
