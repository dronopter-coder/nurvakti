name: Gecici kontrol
on:
  push:
    branches: [gecici-kontrol]
jobs:
  k:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Vakit kaynaklari
        if: ${{ false }}
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          for u in https://ezanvakti.emushaf.net/sehirler/2 https://ezanvakti.emushaf.net/vakitler/9654 "https://namazvakitleri.diyanet.gov.tr/tr-TR/9654/kocaeli-icin-namaz-vakti" "https://vakit.vercel.app/api/countries" "https://prayertimes.api.abdus.dev/api/diyanet/search?q=Basiskele" "https://ezanvakti.herokuapp.com/sehirler/2" "https://api.aladhan.com/v1/timingsByAddress/16-10-2026?address=Ba%C5%9Fiskele%2C%20Kocaeli%2C%20Turkey&method=13"; do
            echo "=================== $u"
            curl -sS -m 25 -A "$UA" -H "Accept: application/json, text/html" -D h.txt -o b.txt "$u"; grep -i "^HTTP\|access-control-allow-origin\|content-type\|server:\|cf-ray" h.txt; head -c 1500 b.txt; echo
          done
          echo "=================== WebView UA'siz"
          curl -sS -m 25 -D - -o b.txt https://ezanvakti.emushaf.net/sehirler/2 | head -3; head -c 300 b.txt
      - name: TDV esma maddeleri
        continue-on-error: true
        run: python3 k/tdv.py
