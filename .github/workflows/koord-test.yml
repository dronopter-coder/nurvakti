# Kıble koordinatı teşhisi (yalnızca teşhis; uygulama derlemesini tetiklemez)
name: Koordinat testi
on:
  push:
    paths: ['.github/workflows/koord-test.yml', '.github/teshis/koord.js', 'www/index.html']
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/teshis/koord.js
